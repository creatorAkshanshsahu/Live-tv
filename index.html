<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveTgTV</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #site {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }
    #fallback {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 15px;
      color: white;
      background: #111;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    button {
      padding: 14px 24px;
      font-size: 18px;
      border: 0;
      border-radius: 8px;
      background: #1976d2;
      color: white;
    }
  </style>
</head>
<body>

  <!-- Load the real LiveTgTV website inside this page -->
  <iframe
    id="site"
    src="https://livetgtv.lovable.app/"
    allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
    allowfullscreen>
  </iframe>

  <div id="fallback">
    <div>Opening LiveTgTV…</div>
    <button onclick="openDirect()">Open LiveTgTV directly</button>
  </div>

  <script>
    function openDirect() {
      window.location.href = "https://livetgtv.lovable.app/";
    }

    // Give an old browser a few seconds. If the iframe cannot be used,
    // offer a direct navigation to the real website.
    setTimeout(function () {
      try {
        var frame = document.getElementById("site");
        if (!frame || !frame.contentWindow) {
          document.getElementById("fallback").style.display = "flex";
        }
      } catch (e) {
        document.getElementById("fallback").style.display = "flex";
      }
    }, 7000);
  </script>

</body>
</html>
